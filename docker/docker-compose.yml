version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: routeops
      POSTGRES_USER: routeops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-routeops_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeops"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://routeops:${DB_PASSWORD:-routeops_dev}@db:5432/routeops
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-key-change-in-prod}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
